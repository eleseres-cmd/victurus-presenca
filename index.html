button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}

:focus-visible{outline:3px solid var(--mat);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding:0 18px 110px}

.brand small{display:block;color:var(--soft);font-weight:600;font-size:14px}
.brand h1{font-size:34px;font-weight:800;letter-spacing:.01em}
.belt{height:10px;border-radius:3px;background:var(--ink);position:relative;margin:6px 0 18px}
.belt::after{content:"";position:absolute;right:16%;top:0;bottom:0;width:15%;background:var(--mat)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:14px}
.card h2{font-size:24px;font-weight:700;margin-bottom:10px}
.muted{color:var(--soft)}
.small{font-size:14px}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px}
.stat .num{font-size:28px;font-weight:700;display:block}
.stat span{font-size:13px;color:var(--soft)}
.stat.hi{background:var(--mat);border-color:var(--mat);color:var(--mat-ink)}
.stat.hi span{color:inherit;opacity:.85}

.monthbar{display:flex;align-items:center;justify-content:space-between;margin-top:6px}
.monthbar strong{font-family:"Barlow Condensed",sans-serif;font-size:22px}
.iconbtn{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:20px;display:grid;place-items:center}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:14px;font-weight:700}
.btn.primary{background:var(--mat);color:var(--mat-ink)}
.btn.line{border:1.5px solid var(--line);background:var(--surface)}
.btn.full{width:100%}
.btn.sm{min-height:38px;padding:0 12px;font-size:14px;border-radius:10px}

/* Check-in */
.checkin{text-align:center;padding:26px 16px 20px}
.oss{width:200px;height:200px;border-radius:50%;margin:8px auto 16px;background:var(--mat);color:var(--mat-ink);display:grid;place-items:center;box-shadow:0 0 0 10px var(--sunk);transition:transform .15s}
.oss:active{transform:scale(.97)}
.oss .num{font-size:44px;font-weight:800}
.oss small{display:block;font-weight:600;font-size:15px;margin-top:2px}
.oss.done{background:var(--ok);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:6px 0 4px}
.chip{padding:8px 14px;border-radius:999px;border:1.5px solid var(--line);font-weight:600;font-size:15px;background:var(--surface)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
input[type=text],input[type=number],textarea,select{width:100%;background:var(--sunk);border:1.5px solid transparent;border-radius:12px;padding:12px 13px}
input:focus,textarea:focus,select:focus{border-color:var(--mat);outline:none}
label.lbl{display:block;font-weight:600;font-size:14px;margin:12px 0 6px}

/* Lists */
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .grow{flex:1;min-width:0}
.row .t{font-weight:600}
.row .s{font-size:14px;color:var(--soft)}
.tag{font-size:12px;font-weight:700;padding:4px 9px;border-radius:999px;white-space:nowrap}
.tag.ok{background:var(--ok-bg);color:var(--ok)}
.tag.pend{background:var(--warn-bg);color:var(--warn)}
.tag.no{background:var(--no-bg);color:var(--no)}
.daygrp{font-weight:700;font-size:14px;color:var(--soft);margin-top:14px;text-transform:capitalize}
.person{padding:14px 0;border-bottom:1px solid var(--line)}
.person:last-child{border-bottom:0}
.person .head{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.person .head .num{font-size:26px;font-weight:700}
.person .meta{font-size:14px;color:var(--soft);margin:2px 0 10px}
.empty{text-align:center;padding:28px 10px;color:var(--soft)}
.guide{white-space:pre-wrap;line-height:1.6}
.hello{text-align:center;padding:4px 0 2px}
.alert{display:flex;gap:12px;align-items:flex-start;background:var(--warn-bg);border:1.5px solid var(--warn);border-radius:18px;padding:16px;margin-top:14px}
.alert .bell{font-size:26px;line-height:1}
.hello h2{font-size:38px;font-weight:800}
.slot{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;background:var(--sunk);margin-top:8px}
.slot.done{background:var(--ok-bg)}
.slot .hr{font-size:26px;font-weight:700;min-width:64px}
.slot .t{font-weight:600}.slot .s{font-size:13px;color:var(--soft)}
.agrow{display:grid;grid-template-columns:76px 104px 1fr 42px;gap:6px;margin-top:6px;align-items:center}
.agrow input,.agrow select{padding:10px 8px}
input[type=password],input[type=time]{width:100%;background:var(--sunk);border:1.5px solid transparent;border-radius:12px;padding:12px 13px}
input[type=password]{font-size:22px;letter-spacing:.3em;text-align:center}
.tick{flex:none;width:46px;height:46px;border-radius:50%;border:2px solid var(--mat);color:var(--mat);font-size:22px;font-weight:800;display:grid;place-items:center;background:var(--surface)}
.tick:disabled{opacity:1;border-color:var(--line);color:transparent}
.tick.on,.tick.on:disabled{background:var(--ok);border-color:var(--ok);color:#fff}
.row.eu{background:var(--sunk);border-radius:12px;padding:12px;border-bottom:0;margin:4px 0}

/* Tabs */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav.tabs .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav.tabs button{padding:10px 0 12px;font-size:12px;font-weight:600;color:var(--soft);display:flex;flex-direction:column;align-items:center;gap:3px}
nav.tabs button svg{width:23px;height:23px}
nav.tabs button[aria-current="page"]{color:var(--mat)}

dialog{border:0;border-radius:20px;padding:20px;background:var(--surface);color:var(--ink);width:min(92vw,420px);margin:auto}
dialog::backdrop{background:rgba(5,12,24,.55)}
dialog h2{font-size:26px;margin-bottom:6px}
.sum{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)}
.sum.total{font-weight:700;font-size:20px;border-bottom:0}
.dlg-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}

.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:12px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30;max-width:90vw;text-align:center}
.toast.on{opacity:1}
.hidden{display:none!important}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
/* Relatório */
.rel-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.rel-top h2{font-size:30px;margin:0}
.rel-kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:14px}
@media (min-width:520px){.rel-kpis{grid-template-columns:repeat(4,1fr)}}
.chart{width:100%;height:auto;display:block}
.ringwrap{display:flex;align-items:center;gap:18px}
.ringwrap .num{font-size:22px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:10px}
.cal .h{font-size:12px;font-weight:700;color:var(--soft);text-align:center;padding-bottom:2px}
.cal .d{aspect-ratio:1;border-radius:10px;display:grid;place-items:center;font-weight:700;font-size:14px;background:var(--sunk);color:var(--soft)}
.cal .d.vazio{background:none}
.cal .d.dado{background:var(--ok);color:#fff}
.cal .d.falta{background:var(--no);color:#fff}
.cal .d.extra{background:var(--mat);color:var(--mat-ink)}
.cal .d.prox{background:var(--surface);border:2px dashed var(--line);color:var(--ink)}
.legenda{display:flex;flex-wrap:wrap;gap:12px;margin-top:12px;font-size:13px;color:var(--soft)}
.legenda i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:5px;vertical-align:-1px}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;color:var(--soft);font-weight:600;padding:6px 4px;border-bottom:1px solid var(--line)}
.tbl td{padding:8px 4px;border-bottom:1px solid var(--line)}
.so-print{display:none}
@media print{
  :root,:root:not([data-theme="light"]){--bg:#fff;--surface:#fff;--sunk:#EEF2F7;--ink:#0F1B2D;--soft:#4A5A70;--line:#CBD5E1;--mat:#1E5BB8;--mat-ink:#fff;--ok:#1F8A55;--ok-bg:#E2F4EA;--warn:#B26A00;--warn-bg:#FFF1D9;--no:#B3261E;--no-bg:#FBE4E2}
  body{background:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  nav.tabs,.noprint,.toast,dialog{display:none!important}
  .so-print{display:block}
  .wrap{padding-bottom:0;max-width:none}
  header.top{padding-top:0}
  .card,.stat{break-inside:avoid}
  @page{margin:14mm}
}
</style>
</head>

<script>
/* ---------- Estado ---------- */
let token = null; try { token = localStorage.getItem("pv_token"); } catch(e) {}
let papel = null; try { papel = localStorage.getItem("pv_papel"); } catch(e) {}
let pub = null, est = null, adm = null;
let relNome = null;
let aba = "painel", mes = null, loginNome = "", modoAdmin = false, ocupado = false;

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const brl = v => (v || 0).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
const DIAS = ["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"];
const NOMES_DIA = ["domingo","segunda","terça","quarta","quinta","sexta","sábado"];
const minutos = h => { const [a,b] = String(h).split(":").map(Number); return (a||0)*60 + (b||0); };
const mesDe = d => d.slice(0,7);
function nomeMes(m){ const [y,mo] = m.split("-").map(Number); const t = new Date(y, mo-1, 1).toLocaleDateString("pt-BR", { month: "long", year: "numeric" }); return t.charAt(0).toUpperCase() + t.slice(1); }
function somaMes(m, n){ const [y,mo] = m.split("-").map(Number); const d = new Date(y, mo-1+n, 1); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`; }
function dataCurta(d){ const [y,m,dd] = d.split("-"); return `${dd}/${m}/${y}`; }
function diaExtenso(d){ const [y,m,dd] = d.split("-").map(Number); return new Date(y,m-1,dd).toLocaleDateString("pt-BR", { weekday: "long", day: "numeric", month: "short" }); }
function somaDias(d, n){ const [y,m,dd] = d.split("-").map(Number); const t = new Date(y, m-1, dd+n); return `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,"0")}-${String(t.getDate()).padStart(2,"0")}`; }
function diaSemana(d){ const [y,m,dd] = d.split("-").map(Number); return new Date(y,m-1,dd).getDay(); }
let tt; function toast(t){ const el = $("#toast"); el.textContent = t; el.classList.add("on"); clearTimeout(tt); tt = setTimeout(() => el.classList.remove("on"), 2600); }
function tag(sit){ return sit === "paga" ? `<span class="tag ok">Paga</span>` : sit === "recusada" ? `<span class="tag no">Não contou</span>` : `<span class="tag pend">A pagar</span>`; }

async function api(rota, dados){
  const r = await fetch("/api/" + rota, { method: dados ? "POST" : "GET",
    headers: { "content-type": "application/json", ...(token ? { authorization: "Bearer " + token } : {}) },
    body: dados ? JSON.stringify(dados) : undefined });
  const j = await r.json().catch(() => ({ erro: "Sem resposta do servidor." }));
  if (r.status === 401 && token && rota !== "login" && rota !== "admin-login") { sair(true); throw new Error(j.erro || "Entre de novo."); }
  if (!r.ok) throw new Error(j.erro || "Algo deu errado.");
  return j;
}
function salvarSessao(t, p){ token = t; papel = p; try { localStorage.setItem("pv_token", t); localStorage.setItem("pv_papel", p); } catch(e) {} }
function sair(silencioso){ token = null; papel = null; est = null; adm = null; try { localStorage.removeItem("pv_token"); localStorage.removeItem("pv_papel"); } catch(e) {} $("#tabs").classList.add("hidden"); if (!silencioso) toast("Você saiu."); carregar(); }

/* ---------- Início ---------- */
async function carregar(){
  try {
    if (token && papel === "colab") { est = await api("eu"); mes = mes || mesDe(est.agora.data); return render(); }
    if (token && papel === "admin") { adm = await api("admin"); mes = mes || mesDe(adm.agora.data); return render(); }
    pub = await api("publico"); render();
  } catch(e) { if (token) return; $("#view").innerHTML = `<div class="card"><h2>Sem conexão</h2><p class="muted">${esc(e.message)}</p><button class="btn primary full" style="margin-top:12px" data-recarregar>Tentar de novo</button></div>`; }
}
setInterval(() => { if (token && document.visibilityState === "visible" && !(papel === "admin" && aba === "equipe") && !document.querySelector("#view input:focus, #view select:focus") && !$("#dlg").open) carregar(); }, 30000);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && token) carregar(); });

function render(){
  if (papel === "admin" && adm && relNome && adm.equipe[relNome]) { $("#tabs").classList.add("hidden"); return telaRelatorio(relNome); }
  if (papel === "admin" && adm) { $("#tabs").classList.remove("hidden"); document.querySelectorAll("#tabs button").forEach(b => b.dataset.tab === aba ? b.setAttribute("aria-current","page") : b.removeAttribute("aria-current")); return ({ painel: telaPainel, presencas: telaPresencas, pagamentos: telaPagamentos, equipe: telaEquipe })[aba](); }
  $("#tabs").classList.add("hidden");
  if (papel === "colab" && est) return telaColab();
  if (pub && pub.setup) return telaSetup();
  return modoAdmin ? telaLoginAdmin() : telaLogin();
}
function barraMes(){ return `<div class="monthbar"><button class="iconbtn" data-mes="-1" aria-label="Mês anterior">‹</button><strong>${nomeMes(mes)}</strong><button class="iconbtn" data-mes="1" aria-label="Próximo mês">›</button></div>`; }

/* ---------- Entrar ---------- */
function telaSetup(){
  $("#view").innerHTML = `<div class="card"><h2>Primeiro acesso</h2>
    <p class="muted small">Crie a senha do administrador (Eleser). Ela dá acesso ao painel, aos pagamentos e às senhas da equipe.</p>
    <label class="lbl" for="sAdm">Nova senha (mínimo 6 caracteres)</label><input type="password" id="sAdm" autocomplete="new-password" style="font-size:18px;letter-spacing:.1em">
    <button class="btn primary full" style="margin-top:14px" data-setup>Criar e entrar</button></div>`;
}
function telaLogin(){
  const nomes = (pub && pub.equipe) || [];
  $("#view").innerHTML = `<div class="card"><h2>Entrar</h2><p class="muted small">Toque no seu nome e digite sua senha.</p>
    <div class="chips" style="justify-content:flex-start;margin-top:12px">${nomes.map(n => `<button class="chip" data-login="${esc(n)}" aria-pressed="${n === loginNome}">${esc(n)}</button>`).join("")}</div>
    <label class="lbl" for="senha">Senha</label>
    <input type="password" id="senha" inputmode="numeric" autocomplete="current-password" maxlength="6" placeholder="••••" ${loginNome ? "" : "disabled"}>
    <button class="btn primary full" style="margin-top:14px" data-entrar ${loginNome ? "" : "disabled"}>Entrar</button></div>
    <p class="small" style="text-align:center;margin-top:18px"><button class="muted" style="text-decoration:underline" data-modoadmin>Entrar como administrador</button></p>`;
}
function telaLoginAdmin(){
  $("#view").innerHTML = `<div class="card"><h2>Administrador</h2>
    <label class="lbl" for="sAdm">Senha do administrador</label><input type="password" id="sAdm" autocomplete="current-password" style="font-size:18px;letter-spacing:.1em">
    <button class="btn primary full" style="margin-top:14px" data-entraradm>Entrar</button></div>
    <p class="small" style="text-align:center;margin-top:18px"><button class="muted" style="text-decoration:underline" data-modocolab>Voltar para colaboradores</button></p>`;
}

/* ---------- Colaborador ---------- */
function proximos(agenda, agora, dias = 7){
  const out = [], nAgora = minutos(agora.hora);
  for (let k = 0; k <= dias; k++) {
    const d = somaDias(agora.data, k), ds = diaSemana(d);
    agenda.filter(a => Number(a.dia) === ds).sort((x,y) => minutos(x.hora) - minutos(y.hora)).forEach(a => {
      if (k === 0 && nAgora > minutos(a.hora) + 60) return;
      out.push({ id: `${d}_${a.hora.replace(":","")}`, data: d, hora: a.hora, k, dia: ds });
    });
  }
  return out;
}
const quando = sl => sl.k === 0 ? "hoje" : sl.k === 1 ? "amanhã" : NOMES_DIA[sl.dia];

function telaColab(){
  const e = est, agora = e.agora, pagas = new Set(e.pagas);
  const sit = a => a.status === "recusada" ? "recusada" : pagas.has(a.id) ? "paga" : "pendente";
  const hojeSlots = e.agenda.filter(a => Number(a.dia) === agora.dia).sort((x,y) => minutos(x.hora) - minutos(y.hora));
  const cards = hojeSlots.map(sl => {
    const id = `${agora.data}_${sl.hora.replace(":","")}`, feita = e.aulas.find(a => a.id === id), c = e.confs[id];
    const libera = minutos(sl.hora) - 60;
    let acao;
    if (feita) acao = `<span class="tag ${feita.status === "recusada" ? "no" : "ok"}">${feita.status === "recusada" ? "Não contou" : "Validada às " + esc(feita.hora)}</span>`;
    else if (c && c.resposta === "nao") acao = `<span class="tag no">Você não vai</span>`;
    else if (minutos(agora.hora) < libera) acao = `<button class="btn line sm" disabled>Libera às ${String(Math.floor(libera/60)).padStart(2,"0")}:${String(libera%60).padStart(2,"0")}</button>`;
    else acao = `<button class="btn primary sm" data-validar="${esc(sl.hora)}">Validar aula</button>`;
    return `<div class="slot ${feita && feita.status !== "recusada" ? "done" : ""}"><div class="hr num">${esc(sl.hora)}</div><div class="grow"><div class="t">Aula</div><div class="s">Hoje</div></div>${acao}</div>`;
  }).join("") + e.aulas.filter(a => a.data === agora.data && a.extra).map(a => `<div class="slot done"><div class="hr num">${esc(a.hora)}</div><div class="grow"><div class="t">Aula extra</div><div class="s">Hoje</div></div><span class="tag ok">Validada</span></div>`).join("");

  const prox = proximos(e.agenda, agora);
  const pend = prox.find(sl => !e.confs[sl.id] && !e.aulas.find(a => a.id === sl.id));
  const alerta = pend ? `<div class="alert" role="alert"><div class="bell" aria-hidden="true">🔔</div><div style="flex:1"><strong>Você tem aula ${quando(pend)} às ${esc(pend.hora)}.</strong><p class="small" style="margin:4px 0 10px">Confirme se vai.</p>
      <div style="display:flex;gap:8px"><button class="btn primary sm" data-conf="${pend.id}|vou">Vou</button><button class="btn line sm" data-conf="${pend.id}|nao">Não vou</button></div></div></div>` : "";

  const semana = [1,2,3,4,5,6,0].map(d => { const ls = e.agenda.filter(a => Number(a.dia) === d).sort((x,y) => minutos(x.hora) - minutos(y.hora));
    return ls.length ? `<div class="row"><div class="grow"><div class="t">${DIAS[d]}${d === agora.dia ? ` <span class="tag pend">hoje</span>` : ""}</div></div><div class="s">${ls.map(a => esc(a.hora)).join("<br>")}</div></div>` : ""; }).join("");
  const lista = e.aulas.slice().sort((x,y) => (y.data+y.hora).localeCompare(x.data+x.hora));
  const doMes = lista.filter(a => mesDe(a.data) === mes);
  const aReceber = lista.filter(a => sit(a) === "pendente").length * e.valor;

  $("#view").innerHTML = `
    <div class="hello"><span class="muted">Oss,</span><h2>${esc(e.nome)}</h2><p class="muted small" style="text-transform:capitalize">${diaExtenso(agora.data)}</p></div>
    ${alerta}
    <div class="card"><h2>Aula de hoje</h2>${cards || `<div class="empty">Você não tem aula hoje.</div>`}
      <button class="btn line full" data-extra style="margin-top:12px">Registrar aula extra</button></div>
    <div class="stats">
      <div class="stat"><span class="num">${doMes.filter(a => a.status !== "recusada").length}</span><span>Aulas no mês</span></div>
      <div class="stat hi"><span class="num">${brl(aReceber)}</span><span>A receber</span></div>
      <div class="stat"><span class="num">${brl(e.recebido)}</span><span>Já recebido</span></div>
    </div>
    <div class="card"><h2>Meu Pix para receber</h2>
      <p class="muted small">${e.pix ? "Cadastrado: <b>" + esc(e.pix) + "</b>" : "Cadastre sua chave Pix para receber no dia 5."}</p>
      <input type="text" id="pixInput" maxlength="120" placeholder="CPF, celular, e-mail ou chave aleatória" value="${esc(e.pix)}" aria-label="Chave Pix" style="margin-top:10px">
      <button class="btn primary full" data-salvarpix style="margin-top:10px">Salvar Pix</button></div>
    <div class="card"><h2>Minha semana</h2>${semana || `<div class="empty">Seus horários ainda não foram cadastrados.</div>`}</div>
    <div class="card">${barraMes()}
      ${doMes.map(a => `<div class="row"><div class="grow"><div class="t">${dataCurta(a.data)} · ${a.extra ? "extra" : "aula " + esc(a.horaAula)}</div><div class="s">validada ${esc(a.hora)}</div></div>${tag(sit(a))}</div>`).join("") || `<div class="empty">Nenhuma aula neste mês.</div>`}
      <p class="small muted" style="margin-top:8px">${brl(e.valor)} por aula. Fechamento todo dia 30, pagamento dia 5.</p></div>
    <button class="btn line full" style="margin-top:14px" data-sair>Sair</button>`;
}

/* ---------- Admin ---------- */
function pagasAdm(){ const s = new Set(); adm.pagamentos.forEach(p => (p.aulaIds || []).forEach(id => s.add(p.nome + "|" + id))); return s; }
function sitAdm(nome, a, pagas){ return a.status === "recusada" ? "recusada" : pagas.has(nome + "|" + a.id) ? "paga" : "pendente"; }
const nomesEquipe = () => Object.keys(adm.equipe);
const valor = () => adm.config.valor;

function telaPainel(){
  const pagas = pagasAdm(), agora = adm.agora;
  let aulasMes = 0, pendTotal = 0;
  nomesEquipe().forEach(n => adm.equipe[n].aulas.forEach(a => { const s = sitAdm(n, a, pagas); if (mesDe(a.data) === mes && s !== "recusada") aulasMes++; if (s === "pendente") pendTotal++; }));
  const pagoMes = adm.pagamentos.filter(p => mesDe(p.data) === mes).reduce((t,p) => t + p.total, 0);
  const hoje = [];
  nomesEquipe().forEach(n => adm.equipe[n].agenda.filter(a => Number(a.dia) === agora.dia).forEach(a => hoje.push({ n, hora: a.hora })));
  hoje.sort((x,y) => minutos(x.hora) - minutos(y.hora));
  const linhasHoje = hoje.map(({ n, hora }) => {
    const id = `${agora.data}_${hora.replace(":","")}`, eq = adm.equipe[n], feita = eq.aulas.find(a => a.id === id), c = eq.confs[id];
    const st = feita ? `<span class="tag ok">Validou ${esc(feita.hora)}</span>` : c ? (c.resposta === "vou" ? `<span class="tag pend">Confirmou</span>` : `<span class="tag no">Não vai</span>`) : `<span class="tag pend">Sem resposta</span>`;
    return `<div class="row"><div class="hr num" style="min-width:58px;font-size:22px">${esc(hora)}</div><div class="grow"><div class="t">${esc(n)}</div>${c && c.motivo ? `<div class="s">${esc(c.motivo)}</div>` : ""}</div>${st}</div>`;
  }).join("");
  const pessoas = nomesEquipe().map(n => {
    const eq = adm.equipe[n], noMes = eq.aulas.filter(a => mesDe(a.data) === mes && a.status !== "recusada").length, pend = eq.aulas.filter(a => sitAdm(n, a, pagas) === "pendente").length;
    return `<div class="person"><div class="head"><strong>${esc(n)}</strong><span class="num">${brl(pend * valor())}</span></div>
      <div class="meta">${noMes} aula${noMes === 1 ? "" : "s"} em ${nomeMes(mes).split(" ")[0]}, ${pend} a pagar${eq.temSenha ? "" : ". Sem senha ainda"}</div>
      <div class="meta">Pix: ${eq.pix ? `<b>${esc(eq.pix)}</b> <button class="btn line sm" data-copiar="${esc(eq.pix)}">Copiar</button>` : "ainda não cadastrado"}</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary sm" data-pagar="${esc(n)}" ${pend ? "" : "disabled"}>Registrar pagamento</button><button class="btn line sm" data-manual="${esc(n)}">Pagamento manual</button><button class="btn line sm" data-rel="${esc(n)}">Relatório</button></div></div>`;
  }).join("");
  $("#view").innerHTML = `${barraMes()}
    <p class="small muted" style="margin-top:10px;text-align:center">${brl(valor())} por aula. Fechamento todo dia 30, pagamento dia 5.</p>
    <div class="stats"><div class="stat"><span class="num">${aulasMes}</span><span>Aulas no mês</span></div>
      <div class="stat hi"><span class="num">${brl(pendTotal * valor())}</span><span>A pagar agora</span></div>
      <div class="stat"><span class="num">${brl(pagoMes)}</span><span>Pago no mês</span></div></div>
    <div class="card"><h2>Aulas de hoje</h2>${linhasHoje || `<div class="empty">Nenhuma aula na agenda de hoje.</div>`}</div>
    <div class="card"><h2>Colaboradores</h2>${pessoas || `<div class="empty">Cadastre a equipe na aba Equipe.</div>`}</div>`;
}

/* ---------- Relatório do colaborador ---------- */
const MES_CURTO = ["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
function slotsDoMes(agenda, m){
  const [y,mo] = m.split("-").map(Number), dias = new Date(y, mo, 0).getDate(), out = [];
  for (let d = 1; d <= dias; d++) {
    const ds = `${m}-${String(d).padStart(2,"0")}`, wd = diaSemana(ds);
    agenda.filter(a => Number(a.dia) === wd).forEach(a => out.push({ data: ds, hora: a.hora, id: `${ds}_${a.hora.replace(":","")}` }));
  }
  return out;
}
function inicioControle(){ let ini = adm.agora.data; Object.values(adm.equipe).forEach(eq => eq.aulas.forEach(a => { if (a.data < ini) ini = a.data; })); return ini; }
function jaPassou(sl){ const ag = adm.agora; if (sl.data < inicioControle()) return false; return sl.data < ag.data || (sl.data === ag.data && minutos(ag.hora) >= minutos(sl.hora) + 60); }
function resumoMes(n, m){
  const eq = adm.equipe[n], todos = slotsDoMes(eq.agenda, m), prev = todos.filter(jaPassou);
  const aulas = eq.aulas.filter(a => mesDe(a.data) === m && a.status !== "recusada");
  const ids = new Set(aulas.map(a => a.id));
  const cumpridas = prev.filter(sl => ids.has(sl.id)).length;
  return { todos, prev, aulas, dadas: aulas.length, cumpridas, faltas: prev.length - cumpridas, extras: aulas.filter(a => a.extra).length,
    pct: prev.length ? Math.round(cumpridas / prev.length * 100) : null };
}
function graficoBarras(n, fim){
  const meses = [-5,-4,-3,-2,-1,0].map(k => somaMes(fim, k)), dados = meses.map(m => ({ m, r: resumoMes(n, m) }));
  const max = Math.max(4, ...dados.map(x => Math.max(x.r.prev.length, x.r.dadas)));
  const W = 600, H = 300, base = 240, alt = 190, gw = W / 6, bw = 34;
  const barras = dados.map((x, i) => {
    const cx = gw * i + gw / 2, hp = x.r.prev.length / max * alt, hd = x.r.dadas / max * alt;
    return `<rect x="${cx - bw - 2}" y="${base - hp}" width="${bw}" height="${hp}" rx="5" fill="var(--sunk)" stroke="var(--line)"/>
      <rect x="${cx + 2}" y="${base - hd}" width="${bw}" height="${hd}" rx="5" fill="var(--mat)"/>
      <text x="${cx - bw / 2 - 2}" y="${base - hp - 6}" text-anchor="middle" font-size="20" fill="var(--soft)">${x.r.prev.length}</text>
      <text x="${cx + bw / 2 + 2}" y="${base - hd - 6}" text-anchor="middle" font-size="22" font-weight="700" fill="var(--ink)">${x.r.dadas}</text>
      <text x="${cx}" y="${base + 34}" text-anchor="middle" font-size="22" font-weight="${x.m === fim ? 700 : 500}" fill="${x.m === fim ? "var(--ink)" : "var(--soft)"}">${MES_CURTO[Number(x.m.slice(5)) - 1]}</text>`;
  }).join("");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Aulas previstas e dadas nos últimos 6 meses">
    <line x1="0" x2="${W}" y1="${base}" y2="${base}" stroke="var(--line)"/>${barras}</svg>
    <div class="legenda"><span><i style="background:var(--sunk);border:1px solid var(--line)"></i>Previstas na agenda</span><span><i style="background:var(--mat)"></i>Dadas (validadas)</span></div>`;
}
function anel(pct){
  const r = 46, c = 2 * Math.PI * r, v = pct == null ? 0 : pct, cor = v >= 85 ? "var(--ok)" : v >= 60 ? "var(--warn)" : "var(--no)";
  return `<svg width="120" height="120" viewBox="0 0 120 120" role="img" aria-label="Presença ${pct == null ? "sem aulas previstas" : pct + "%"}">
    <circle cx="60" cy="60" r="${r}" fill="none" stroke="var(--sunk)" stroke-width="14"/>
    <circle cx="60" cy="60" r="${r}" fill="none" stroke="${cor}" stroke-width="14" stroke-linecap="round" stroke-dasharray="${c * v / 100} ${c}" transform="rotate(-90 60 60)"/>
    <text x="60" y="66" text-anchor="middle" font-size="26" font-weight="800" fill="var(--ink)" font-family="Barlow Condensed, sans-serif">${pct == null ? "—" : pct + "%"}</text></svg>`;
}
function calendario(n, m, r){
  const [y,mo] = m.split("-").map(Number), dias = new Date(y, mo, 0).getDate(), ini = new Date(y, mo - 1, 1).getDay();
  const ids = new Set(r.aulas.map(a => a.id)), porDia = {};
  r.todos.forEach(sl => { (porDia[sl.data] = porDia[sl.data] || []).push(sl); });
  let html = ["D","S","T","Q","Q","S","S"].map(d => `<div class="h">${d}</div>`).join("") + `<div class="d vazio"></div>`.repeat(ini);
  for (let d = 1; d <= dias; d++) {
    const ds = `${m}-${String(d).padStart(2,"0")}`, sls = porDia[ds] || [], extra = r.aulas.some(a => a.data === ds && (a.extra || !sls.find(s => s.id === a.id)));
    let cls = "";
    if (sls.length) { const passou = sls.filter(jaPassou); cls = passou.length ? (passou.every(s => ids.has(s.id)) ? "dado" : "falta") : ds >= adm.agora.data ? "prox" : sls.some(s => ids.has(s.id)) ? "dado" : ""; }
    else if (extra) cls = "extra";
    html += `<div class="d ${cls}">${d}</div>`;
  }
  return `<div class="cal">${html}</div><div class="legenda"><span><i style="background:var(--ok)"></i>Deu aula</span><span><i style="background:var(--no)"></i>Faltou</span><span><i style="background:var(--mat)"></i>Aula extra</span><span><i style="border:2px dashed var(--line)"></i>Próxima</span></div>`;
}
function telaRelatorio(n){
  const eq = adm.equipe[n], pagas = pagasAdm(), r = resumoMes(n, mes);
  const pendTotal = eq.aulas.filter(a => sitAdm(n, a, pagas) === "pendente").length * valor();
  const pagsN = adm.pagamentos.filter(p => p.nome === n);
  const recebido = pagsN.reduce((t,p) => t + p.total, 0);
  const pagsMes = pagsN.filter(p => mesDe(p.data) === mes);
  const horarios = [1,2,3,4,5,6,0].flatMap(d => eq.agenda.filter(a => Number(a.dia) === d).map(a => `${DIAS[d]} ${a.hora}`)).join(", ") || "sem horário fixo";
  const linhas = r.prev.map(sl => ({ data: sl.data, aula: sl.hora, a: r.aulas.find(a => a.id === sl.id) }))
    .concat(r.aulas.filter(a => !r.prev.find(s => s.id === a.id)).map(a => ({ data: a.data, aula: a.extra ? "extra" : a.horaAula, a })))
    .sort((x,y) => (x.data + x.aula).localeCompare(y.data + y.aula));
  $("#view").innerHTML = `
    <div class="noprint" style="display:flex;gap:8px;margin-bottom:10px"><button class="btn line sm" data-relvoltar>‹ Voltar</button><div style="flex:1"></div><button class="btn primary sm" data-imprimir>Imprimir / PDF</button></div>
    <div class="noprint">${barraMes()}</div>
    <div class="card"><div class="rel-top"><div><p class="muted small">Relatório de presença</p><h2>${esc(n)}</h2>
      <p class="small muted">${nomeMes(mes)}</p></div>
      <p class="small muted" style="text-align:right">Emitido em<br>${dataCurta(adm.agora.data)}</p></div>
      <p class="small" style="margin-top:8px">Horários: ${esc(horarios)}<br>Pix: ${eq.pix ? esc(eq.pix) : "não cadastrado"}<br>Valor por aula: ${brl(valor())}</p></div>
    <div class="rel-kpis">
      <div class="stat"><span class="num">${r.dadas}</span><span>Aulas dadas</span></div>
      <div class="stat"><span class="num">${r.faltas}</span><span>Faltas</span></div>
      <div class="stat"><span class="num">${r.extras}</span><span>Extras</span></div>
      <div class="stat hi"><span class="num">${brl(r.dadas * valor())}</span><span>Valor do mês</span></div>
    </div>
    <div class="card"><h2>Presença no mês</h2>
      <div class="ringwrap">${anel(r.pct)}<div><p><b>${r.cumpridas}</b> de <b>${r.prev.length}</b> aulas da agenda cumpridas</p>
        <p class="small muted" style="margin-top:4px">${r.pct == null ? "Nenhuma aula prevista até agora neste mês." : r.pct >= 85 ? "Ótima frequência." : r.pct >= 60 ? "Frequência regular." : "Frequência baixa."}</p></div></div>
      ${calendario(n, mes, r)}</div>
    <div class="card"><h2>Últimos 6 meses</h2>${graficoBarras(n, mes)}</div>
    <div class="card"><h2>Aulas do mês</h2>${linhas.length ? `<div style="overflow-x:auto"><table class="tbl"><thead><tr><th>Data</th><th>Aula</th><th>Validada</th><th>Situação</th></tr></thead><tbody>
      ${linhas.map(l => `<tr><td>${dataCurta(l.data)}</td><td>${esc(l.aula)}</td><td>${l.a ? (l.a.lancadaPeloAdmin ? "lançada" : esc(l.a.hora)) : "—"}</td><td>${l.a ? tag(sitAdm(n, l.a, pagas)) : `<span class="tag no">Faltou</span>`}</td></tr>`).join("")}
      </tbody></table></div>` : `<div class="empty">Nenhuma aula neste mês.</div>`}</div>
    <div class="card"><h2>Financeiro</h2>
      <div class="sum"><span>A receber (em aberto)</span><span>${brl(pendTotal)}</span></div>
      <div class="sum"><span>Pago neste mês</span><span>${brl(pagsMes.reduce((t,p) => t + p.total, 0))}</span></div>
      <div class="sum total"><span>Total já recebido</span><span>${brl(recebido)}</span></div>
      ${pagsMes.map(p => `<div class="row"><div class="grow"><div class="t">${dataCurta(p.data)} · ${brl(p.total)}</div><div class="s">${p.qtd} aula${p.qtd === 1 ? "" : "s"}, ${esc(p.forma)}${p.manual ? ", manual" : ""}</div></div></div>`).join("")}
      <p class="small muted" style="margin-top:10px">Fechamento todo dia 30, pagamento dia 5.</p></div>
    <p class="so-print small muted" style="margin-top:24px;text-align:center">Victurus Escola de Jiu-Jitsu · Rua Monte Arara, Colina de Laranjeiras, Serra/ES</p>`;
}

function telaPresencas(){
  const pagas = pagasAdm(), todas = [];
  nomesEquipe().forEach(n => adm.equipe[n].aulas.filter(a => mesDe(a.data) === mes).forEach(a => todas.push({ n, ...a })));
  todas.sort((x,y) => (y.data+y.hora).localeCompare(x.data+x.hora));
  let ultimo = "", html = "";
  todas.forEach(a => {
    if (a.data !== ultimo) { html += `<div class="daygrp">${diaExtenso(a.data)}</div>`; ultimo = a.data; }
    const s = sitAdm(a.n, a, pagas);
    html += `<div class="row"><div class="grow"><div class="t">${esc(a.n)}</div><div class="s">${a.extra ? "Aula extra" : "Aula " + esc(a.horaAula)} · ${a.lancadaPeloAdmin ? "lançada por você" : "validada " + esc(a.hora)}</div></div>${tag(s)}
      ${s !== "paga" ? `<button class="btn line sm" data-status="${esc(a.n)}|${a.id}|${s === "recusada" ? "ok" : "recusada"}">${s === "recusada" ? "Contar" : "Não contou"}</button>` : ""}</div>`;
  });
  $("#view").innerHTML = `${barraMes()}<button class="btn line full" style="margin-top:12px" data-lancar>Lançar aula esquecida</button>
    <div class="card">${html || `<div class="empty">Nenhuma presença neste mês.</div>`}</div>`;
}

function telaPagamentos(){
  const lista = adm.pagamentos.filter(p => mesDe(p.data) === mes).sort((a,b) => b.em.localeCompare(a.em));
  $("#view").innerHTML = `${barraMes()}<button class="btn line full" style="margin-top:12px" data-csv>Baixar planilha do mês (CSV)</button>
    <div class="card"><h2>Pagamentos</h2>${lista.map(p => `<div class="row"><div class="grow"><div class="t">${esc(p.nome)} · ${brl(p.total)}</div>
      <div class="s">${dataCurta(p.data)}, ${p.qtd} aula${p.qtd === 1 ? "" : "s"} × ${brl(p.valorUnit)}, ${esc(p.forma)}${p.manual ? ", manual" : ""}${p.obs ? ", " + esc(p.obs) : ""}</div></div>
      <button class="btn line sm" data-desfazer="${p.id}">Desfazer</button></div>`).join("") || `<div class="empty">Nenhum pagamento neste mês.</div>`}</div>`;
}

function telaEquipe(){
  $("#view").innerHTML = `<div class="card"><h2>Valor por aula</h2>
      <div style="display:flex;gap:8px"><input type="number" id="cfgValor" min="0" step="0.5" inputmode="decimal" value="${valor()}" aria-label="Valor por aula"><button class="btn primary" data-salvarvalor>Salvar</button></div></div>
    ${nomesEquipe().map(n => { const eq = adm.equipe[n];
      return `<div class="card" data-colab="${esc(n)}"><h2>${esc(n)}</h2>
        <p class="small muted">${eq.temSenha ? "Senha criada." : "Ainda sem senha."}</p>
        <div class="ag">${eq.agenda.map((a,i) => linhaAgenda(a, i)).join("")}</div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px">
          <button class="btn line sm" data-addag>+ Horário</button><button class="btn primary sm" data-salvarcolab>Salvar horários</button>
          <button class="btn line sm" data-senha>Definir senha</button><button class="btn line sm" data-remover style="color:var(--no)">Remover</button></div></div>`; }).join("")}
    <div class="card"><h2>Novo colaborador</h2><div style="display:flex;gap:8px"><input type="text" id="novoNome" maxlength="40" placeholder="Nome"><button class="btn primary" data-novo>Adicionar</button></div></div>
    <div class="card"><h2>Sua senha de administrador</h2><input type="password" id="novaAdm" autocomplete="new-password" placeholder="Nova senha (mín. 6)" style="font-size:16px;letter-spacing:0;text-align:left">
      <button class="btn line full" style="margin-top:10px" data-senhaadm>Trocar minha senha</button></div>
    <button class="btn line full" style="margin-top:14px" data-sair>Sair</button>`;
}
function linhaAgenda(a, i){
  return `<div class="agrow" style="grid-template-columns:1fr 1fr 42px"><select aria-label="Dia">${DIAS.map((d,k) => `<option value="${k}" ${Number(a.dia) === k ? "selected" : ""}>${d}</option>`).join("")}</select>
    <input type="time" value="${esc(a.hora)}" aria-label="Horário"><button class="iconbtn" data-delag aria-label="Remover horário">×</button></div>`;
}
function agendaDoCard(card){ return [...card.querySelectorAll(".agrow")].map(r => ({ dia: Number(r.querySelector("select").value), hora: r.querySelector("input").value })).filter(a => a.hora); }

/* ---------- Diálogos ---------- */
function abrir(html){ const d = $("#dlg"); d.innerHTML = html; d.showModal(); }
function dlgPagar(n){
  const pagas = pagasAdm(), pend = adm.equipe[n].aulas.filter(a => sitAdm(n, a, pagas) === "pendente").sort((a,b) => a.data.localeCompare(b.data)), pix = adm.equipe[n].pix;
  abrir(`<h2>Pagar ${esc(n)}</h2><p class="muted small">Aulas de ${dataCurta(pend[0].data)} a ${dataCurta(pend[pend.length-1].data)}</p>
    <div class="sum"><span>Aulas</span><span>${pend.length}</span></div><div class="sum"><span>Valor por aula</span><span>${brl(valor())}</span></div>
    <div class="sum total"><span>Total</span><span>${brl(pend.length * valor())}</span></div>
    <div class="sum"><span>Pix</span><span>${pix ? `${esc(pix)} <button class="btn line sm" data-copiar="${esc(pix)}">Copiar</button>` : "Não cadastrado"}</span></div>
    ${formaHtml()}<div class="dlg-actions"><button class="btn line" data-fechar>Cancelar</button><button class="btn primary" data-confpagar="${esc(n)}">Confirmar</button></div>`);
}
function formaHtml(){ return `<label class="lbl">Forma</label><div class="chips" style="justify-content:flex-start">${["Pix","Dinheiro","Transferência"].map(f => `<button class="chip" data-forma="${f}" aria-pressed="${f === "Pix"}">${f}</button>`).join("")}</div>
  <label class="lbl" for="obs">Observação</label><input type="text" id="obs" maxlength="140" placeholder="Opcional">`; }
const formaSel = () => (document.querySelector('#dlg [data-forma][aria-pressed="true"]') || {}).dataset?.forma || "Pix";
function dlgManual(n){
  abrir(`<h2>Pagamento manual</h2><p class="muted small">${esc(n)}: para aulas que não foram validadas no app.</p>
    <label class="lbl" for="mQtd">Quantidade de aulas</label><input type="number" id="mQtd" min="1" step="1" inputmode="numeric" value="1">
    <label class="lbl" for="mVal">Valor por aula</label><input type="number" id="mVal" min="0" step="0.5" inputmode="decimal" value="${valor()}">
    ${formaHtml()}<div class="dlg-actions"><button class="btn line" data-fechar>Cancelar</button><button class="btn primary" data-confmanual="${esc(n)}">Registrar</button></div>`);
}
function dlgLancar(){
  abrir(`<h2>Lançar aula</h2><p class="muted small">Para quando o colaborador deu a aula e esqueceu de validar.</p>
    <label class="lbl" for="lNome">Colaborador</label><select id="lNome">${nomesEquipe().map(n => `<option>${esc(n)}</option>`).join("")}</select>
    <label class="lbl" for="lData">Data</label><input type="date" id="lData" value="${adm.agora.data}" style="width:100%;background:var(--sunk);border:0;border-radius:12px;padding:12px">
    <label class="lbl" for="lHora">Horário da aula</label><input type="time" id="lHora" value="19:15">
    <div class="dlg-actions"><button class="btn line" data-fechar>Cancelar</button><button class="btn primary" data-conflancar>Lançar</button></div>`);
}
function dlgSenha(n){
  abrir(`<h2>Senha de ${esc(n)}</h2><p class="muted small">Digite de 4 a 6 números, ou deixe em branco para o app gerar uma.</p>
    <input type="password" id="nSenha" inputmode="numeric" maxlength="6" placeholder="••••">
    <div class="dlg-actions"><button class="btn line" data-fechar>Cancelar</button><button class="btn primary" data-confsenha="${esc(n)}">Salvar senha</button></div>`);
}

/* ---------- Ações ---------- */
async function acao(fn, okMsg){
  if (ocupado) return; ocupado = true;
  try { const r = await fn(); if (okMsg) toast(typeof okMsg === "function" ? okMsg(r) : okMsg); await carregar(); return r; }
  catch(e) { toast(e.message); } finally { ocupado = false; }
}
function baixarCsv(){
  const pagas = pagasAdm(), linhas = [["Data","Aula","Colaborador","Validada às","Situação","Valor"]];
  nomesEquipe().forEach(n => adm.equipe[n].aulas.filter(a => mesDe(a.data) === mes).forEach(a => { const s = sitAdm(n, a, pagas);
    linhas.push([dataCurta(a.data), a.extra ? "extra" : a.horaAula, n, a.hora, s === "paga" ? "Paga" : s === "recusada" ? "Não contou" : "A pagar", s === "recusada" ? "0,00" : valor().toFixed(2).replace(".", ",")]); }));
  const csv = "\ufeff" + linhas.map(l => l.map(c => `"${String(c).replace(/"/g,'""')}"`).join(";")).join("\n");
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv" })); a.download = `presencas-${mes}.csv`; a.click();
}

document.addEventListener("click", async e => {
  const t = e.target.closest("button"); if (!t) return;
  const d = t.dataset;
  if (d.tab) { aba = d.tab; relNome = null; render(); window.scrollTo(0,0); return; }
  if (d.rel) { relNome = d.rel; render(); window.scrollTo(0,0); return; }
  if ("relvoltar" in d) { relNome = null; render(); window.scrollTo(0,0); return; }
  if ("imprimir" in d) { const t0 = document.title; document.title = `Relatorio ${relNome} ${mes}`; window.print(); setTimeout(() => { document.title = t0; }, 1000); return; }
  if (d.mes) { mes = somaMes(mes, Number(d.mes)); render(); return; }
  if ("recarregar" in d) return carregar();
  if (d.login) { loginNome = d.login; render(); setTimeout(() => $("#senha") && $("#senha").focus(), 0); return; }
  if ("modoadmin" in d) { modoAdmin = true; render(); return; }
  if ("modocolab" in d) { modoAdmin = false; render(); return; }
  if ("setup" in d) return acao(async () => { const r = await api("setup", { senha: $("#sAdm").value }); salvarSessao(r.token, "admin"); }, "Administrador criado!");
  if ("entrar" in d) return acao(async () => { const r = await api("login", { nome: loginNome, senha: $("#senha").value.trim() }); salvarSessao(r.token, "colab"); }, () => `Oss, ${loginNome.split(" ")[0]}!`);
  if ("entraradm" in d) return acao(async () => { const r = await api("admin-login", { senha: $("#sAdm").value }); salvarSessao(r.token, "admin"); }, "Bem-vindo, Eleser!");
  if ("sair" in d) return sair();
  if (d.validar) return acao(() => api("validar", { hora: d.validar }), "Aula validada. Oss, bom treino!");
  if ("extra" in d) { if (confirm("Registrar uma aula extra agora?")) acao(() => api("validar", { extra: true }), "Aula extra registrada."); return; }
  if (d.conf) { const [id, resp] = d.conf.split("|"); let motivo = ""; if (resp === "nao") { const m = prompt("Quer dizer o motivo? (opcional)"); if (m === null) return; motivo = m; }
    return acao(() => api("confirmar", { id, resposta: resp, motivo }), resp === "vou" ? "Confirmado. Te esperamos no tatame!" : "Aviso enviado ao Eleser."); }
  if ("salvarpix" in d) return acao(() => api("pix", { pix: $("#pixInput").value }), "Pix salvo!");
  if (d.copiar) { (navigator.clipboard ? navigator.clipboard.writeText(d.copiar) : Promise.reject()).then(() => toast("Chave Pix copiada."), () => toast("Chave: " + d.copiar)); return; }
  if (d.pagar) return dlgPagar(d.pagar);
  if (d.manual) return dlgManual(d.manual);
  if (d.forma) { t.parentElement.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", c === t)); return; }
  if ("fechar" in d) { $("#dlg").close(); return; }
  if (d.confpagar) return acao(async () => { await api("admin/pagar", { nome: d.confpagar, forma: formaSel(), obs: $("#obs").value }); $("#dlg").close(); }, "Pagamento registrado.");
  if (d.confmanual) return acao(async () => { await api("admin/pagamento-manual", { nome: d.confmanual, qtd: $("#mQtd").value, valorUnit: $("#mVal").value, forma: formaSel(), obs: $("#obs").value }); $("#dlg").close(); }, "Pagamento manual registrado.");
  if (d.desfazer) { if (confirm("Desfazer este pagamento? As aulas voltam para 'A pagar'.")) acao(() => api("admin/desfazer", { id: d.desfazer }), "Pagamento desfeito."); return; }
  if (d.status) { const [n, id, st] = d.status.split("|"); return acao(() => api("admin/aula", { nome: n, id, status: st }), st === "recusada" ? "Marcada como não contou." : "Aula voltou a contar."); }
  if ("lancar" in d) return dlgLancar();
  if ("conflancar" in d) return acao(async () => { await api("admin/lancar-aula", { nome: $("#lNome").value, data: $("#lData").value, hora: $("#lHora").value }); $("#dlg").close(); }, "Aula lançada.");
  if ("csv" in d) return baixarCsv();
  if ("salvarvalor" in d) return acao(() => api("admin/config", { valor: $("#cfgValor").value }), "Valor salvo.");
  const card = t.closest("[data-colab]");
  if ("addag" in d && card) { card.querySelector(".ag").insertAdjacentHTML("beforeend", linhaAgenda({ dia: 1, hora: "19:15" })); return; }
  if ("delag" in d) { t.closest(".agrow").remove(); return; }
  if ("salvarcolab" in d && card) return acao(() => api("admin/colab", { nome: card.dataset.colab, agenda: agendaDoCard(card) }), "Horários salvos.");
  if ("remover" in d && card) { if (confirm(`Remover ${card.dataset.colab} da equipe? As aulas dele continuam guardadas.`)) acao(() => api("admin/remover", { nome: card.dataset.colab }), "Removido."); return; }
  if ("senha" in d && card) return dlgSenha(card.dataset.colab);
  if (d.confsenha) { const r = await acao(() => api("admin/senha", { nome: d.confsenha, senha: $("#nSenha").value.trim() })); if (r) { $("#dlg").close(); alert(`Senha de ${d.confsenha}: ${r.senha}\n\nMande só para ele, no privado.`); } return; }
  if ("novo" in d) { const n = $("#novoNome").value.trim(); if (!n) return toast("Digite o nome."); return acao(() => api("admin/colab", { nome: n, agenda: [] }), "Colaborador adicionado."); }
  if ("senhaadm" in d) return acao(() => api("admin/senha-admin", { nova: $("#novaAdm").value }), "Senha de administrador trocada.");
});
document.addEventListener("keydown", e => { if (e.key !== "Enter") return;
  if (e.target.id === "senha") document.querySelector("[data-entrar]").click();
  if (e.target.id === "sAdm") (document.querySelector("[data-entraradm]") || document.querySelector("[data-setup]")).click(); });

carregar();
</script>
</body>
</html>
